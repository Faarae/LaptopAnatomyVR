<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2A1C" />
      <stop offset="100%" stop-color="#06130D" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="64" height="64" rx="16" fill="#06130D" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#22C55E" stroke-opacity="0.35" stroke-width="2" />

  <!-- Laptop Display Lid -->
  <rect x="13" y="11" width="38" height="26" rx="4" fill="url(#screenBg)" stroke="url(#neonGlow)" stroke-width="2.2" />

  <!-- 3D Isometric Hologram Cube (VR / Anatomy Core) -->
  <!-- Top Face -->
  <path d="M32 17L39.5 21L32 25L24.5 21Z" fill="#22C55E" fill-opacity="0.3" stroke="#4ADE80" stroke-width="1.6" stroke-linejoin="round" />
  <!-- Left Face -->
  <path d="M24.5 21V29L32 33V25Z" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-width="1.6" stroke-linejoin="round" />
  <!-- Right Face -->
  <path d="M32 25V33L39.5 29V21Z" fill="#4ADE80" fill-opacity="0.22" stroke="#22C55E" stroke-width="1.6" stroke-linejoin="round" />
  
  <!-- Glowing Hardware Core Point -->
  <circle cx="32" cy="25" r="1.6" fill="#FACC15" filter="url(#softGlow)" />

  <!-- Laptop Base & Keyboard Chassis -->
  <path d="M8 43C8 41.8 8.9 41 10.1 41H53.9C55.1 41 56 41.8 56 43L58 48C58 49.3 56.9 50.5 55.4 50.5H8.6C7.1 50.5 6 49.3 6 48L8 43Z" fill="#0C2017" stroke="url(#neonGlow)" stroke-width="2" />
  
  <!-- Trackpad Notch Accent -->
  <path d="M27 42.5H37" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round" />
</svg>
